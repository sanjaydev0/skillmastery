<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SkillMastery" />
    <meta name="application-name" content="SkillMastery" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="SkillMastery — an offline-first command center for learning any skill, with a prerequisite knowledge graph and spaced repetition." />
    <title>SkillMastery — Learning Command Center</title>
    <script>
      // Theme boot before paint. Mirrors the prefs kept in IndexedDB.
      try {
        var t = localStorage.getItem('skillmastery:theme') || localStorage.getItem('mh:theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #a3b0c2;
        font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      #boot .mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 2px solid #38bdf8;
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        color: #38bdf8;
        font-weight: 700;
      }
      html:not(.dark) #boot { background: #f6f7f9; color: #4a5666; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div><div class="mark">S</div>Loading your skill graph…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
